version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiosko_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kiosko_user
      POSTGRES_PASSWORD: kiosko_pass
      POSTGRES_DB: kiosko_db
    ports:
      - "5433:5432"
    volumes:
      - pg_kiosko_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosko_user -d kiosko_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Herramienta web para inspeccionar la base de datos en http://localhost:8080
  adminer:
    image: adminer
    container_name: kiosko_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pg_kiosko_data:
