version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kiosko_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kiosko_db
      MYSQL_USER: kiosko_user
      MYSQL_PASSWORD: kiosko_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Herramienta web opcional para inspeccionar la base de datos en http://localhost:8080
  adminer:
    image: adminer
    container_name: kiosko_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
