<section class="auth-wrapper">
  <h2>Iniciar Sesión</h2>
  <p class="subtitulo">Ingresá a la gestión de tu kiosko.</p>

  <form class="formulario" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="caja-input">
      <label for="mail">Email</label>
      <input 
        id="mail" 
        formControlName="mail" 
        type="email" 
        placeholder="Ej: kiosko@gmail.com" 
        required 
        autofocus 
      />
    </div>

    <div class="caja-input">
      <label for="password">Contraseña</label>
      <input 
        id="password" 
        formControlName="password" 
        type="password" 
        placeholder="••••••••" 
        required 
      />
    </div>

    <button type="submit" class="btn-primario" [disabled]="loginForm.invalid">
      Ingresar
    </button>
  </form>

  <div class="pie-form">
    ¿Tu kiosko no está registrado? 
    <a routerLink="/registro" class="link">Creá una cuenta</a>
  </div>
</section>
