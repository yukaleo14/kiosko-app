<section class="login">
  <!-- <button type="button" (click)="cerrarSesion()">Cerrar sesión</button> -->
  <form class="tarjeta-login" (ngSubmit)="onSubmit()">
    <h2>Acceso </h2>
    <p class="subtitulo">Iniciá sesión para gestionar los productos.</p>

    @if (avisoSesionExpirada) {
      <p class="aviso">Tu sesión expiró. Iniciá sesión de nuevo.</p>
    } 

    <div class="campo">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" [(ngModel)]="usuario" name="usuario" required autofocus />
    </div>

    <div class="campo">
      <label for="password">Contraseña</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" required />
    </div>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

    <button type="submit" [disabled]="cargando">
      {{ cargando ? 'Ingresando...' : 'Ingresar' }}
    </button>
  </form>
</section>
